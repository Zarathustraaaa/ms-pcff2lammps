name: Publish v0.1.0b1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v0.1.0b1 prerelease'
    runs-on: ubuntu-latest
    env:
      TAG: v0.1.0b1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification tools
        run: python -m pip install -e '.[dev]' build twine

      - name: Compile and test
        run: |
          python -m compileall -q src tests
          pytest -q tests
          python scripts/check_repository_hygiene.py

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install built wheel and smoke test
        run: |
          python -m pip uninstall -y ms-pcff2lammps
          python -m pip install --force-reinstall dist/*.whl
          ms-pcff2lammps --version
          ms-pcff2lammps --help

      - name: Create annotated tag
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "ms-pcff2lammps 0.1.0b1"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "ms-pcff2lammps 0.1.0b1" \
            --notes-file RELEASE_NOTES.md
