name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

# This workflow is intentionally self-contained. It never expects Materials
# Studio, a PCFF database, native parameter exports, LAMMPS, or private
# validation structures. Those inputs belong to separate local integration
# validation and are not distributable repository dependencies.
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public synthetic/unit tests
        run: pytest -q tests
      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: CLI smoke
        run: |
          ms-pcff2lammps --version
          ms-pcff2lammps --help

  build:
    name: Build source and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build verification tools
        run: python -m pip install build twine
      - name: Build source and wheel
        run: python -m build
      - name: Verify package metadata
        run: python -m twine check dist/*
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Wheel CLI smoke
        run: |
          ms-pcff2lammps --version
          ms-pcff2lammps --help
