name: Release gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification tools
        run: python -m pip install -e '.[dev]' build twine

      - name: Compile
        run: python -m compileall -q src tests

      - name: Public synthetic/unit tests
        run: pytest -q tests

      - name: Repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Build source and wheel
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: |
          python -m pip uninstall -y ms-pcff2lammps
          python -m pip install --force-reinstall dist/*.whl

      - name: Wheel CLI smoke
        run: |
          ms-pcff2lammps --version
          ms-pcff2lammps --help

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: ms-pcff2lammps-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
