[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-pcff2lammps"
version = "0.1.0b1"
description = "Audited Materials Studio PCFF to LAMMPS Class-II conversion utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["LAMMPS", "PCFF", "Class-II", "molecular-dynamics", "force-field"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ms-pcff2lammps = "ms_pcff2lammps.cli:main"

[project.urls]
Repository = "https://github.com/Zarathustraaaa/ms-pcff2lammps"
Issues = "https://github.com/Zarathustraaaa/ms-pcff2lammps/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
